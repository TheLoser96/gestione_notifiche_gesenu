name: Notifica Rifiuti Telegram

on:
  schedule:
    # Esegue ogni giorno alle 18:00 UTC (corrisponde alle 19:00 orario solare / 20:00 orario legale in Italia)
    - cron: '17 17 * * *'
  # Permette di avviare il flusso manualmente dalla scheda Actions per fare test
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py